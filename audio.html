<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio - Italiano Bangla</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      background: #f7f7f7;
      color: #222;
    }
    h1 {
      text-align: center;
      color: #b3282d;
    }
    .unita {
      margin-top: 35px;
      font-size: 22px;
      font-weight: bold;
      color: white;
      background: #b3282d;
      padding: 8px 14px;
      border-radius: 6px;
    }
    .pagina {
      margin-top: 18px;
      font-size: 15px;
      font-weight: bold;
      color: #b3282d;
      text-transform: uppercase;
      letter-spacing: 1px;
      scroll-margin-top: 20px;
    }
    .traccia {
      background: white;
      border-radius: 10px;
      padding: 14px;
      margin: 10px 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .traccia h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #222;
    }
    audio {
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>🎧 Audio del libro</h1>
  <div id="lista-audio"></div>

  <script src="tracce.js"></script>
  <script>
    const contenitore = document.getElementById('lista-audio');
    let ultimaUnita = "";
    let ultimaPagina = "";

    tracce.forEach(t => {
      if (t.unita !== ultimaUnita) {
        contenitore.innerHTML += `<div class="unita">${t.unita}</div>`;
        ultimaUnita = t.unita;
        ultimaPagina = "";
      }
      if (t.pagina !== ultimaPagina) {
        contenitore.innerHTML += `<div class="pagina" id="${t.id}">${t.pagina}</div>`;
        ultimaPagina = t.pagina;
      }
      contenitore.innerHTML += `
        <div class="traccia">
          <h3>${t.titolo}</h3>
          <audio controls>
            <source src="${t.file}" type="audio/mpeg">
          </audio>
        </div>
      `;
    });

    // Salta automaticamente alla sezione giusta, se presente nel link
    if (window.location.hash) {
      const target = document.getElementById(window.location.hash.substring(1));
      if (target) target.scrollIntoView();
    }
  </script>
</body>
</html>
