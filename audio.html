<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio - Italiano Bangla</title>
<style>
body {
  font-family: Arial, sans-serif;
  max-width: 700px;
  margin: 0 auto;
  padding: 30px 20px;
  background-color: #f7f7f7;
  color: #222222;
  text-align: center;
}
h1 {
  color: #b3282d;
  font-size: 20px;
}
.traccia {
  background-color: #ffffff;
  border-radius: 10px;
  padding: 20px;
  margin: 20px 0;
}
.traccia h3 {
  margin: 0 0 15px 0;
  font-size: 18px;
}
audio {
  width: 100%;
}
</style>
</head>
<body>
<div id="contenuto"></div>
<script src="tracce.js"></script>
<script>
var params = new URLSearchParams(window.location.search);
var idRichiesto = params.get("id");
var contenitore = document.getElementById("contenuto");
var trovata = null;
for (var i = 0; i < tracce.length; i++) {
  if (tracce[i].id === idRichiesto) {
    trovata = tracce[i];
  }
}
if (trovata) {
  var html = "<h1>" + trovata.unita + " - " + trovata.pagina + "</h1>";
  html += '<div class="traccia">';
  html += "<h3>" + trovata.titolo + "</h3>";
  html += '<audio controls><source src="' + trovata.file + '"></audio>';
  html += "</div>";
  contenitore.innerHTML = html;
} else {
  var html = "<h1>Tutti gli audio del libro</h1>";
  for (var i = 0; i < tracce.length; i++) {
    var t = tracce[i];
    html += '<div class="traccia">';
    html += "<h3>" + t.unita + " - " + t.pagina + ": " + t.titolo + "</h3>";
    html += '<audio controls><source src="' + t.file + '"></audio>';
    html += "</div>";
  }
  contenitore.innerHTML = html;
}
</script>
</body>
</html>
