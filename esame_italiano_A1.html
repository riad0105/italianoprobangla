"dormiamo":"আমরা ঘুমাই","dormite":"তোমরা ঘুমাও","dormono":"তারা ঘুমায়","dormo":"আমি ঘুমাই",
"leggono":"তারা পড়ে","leggano":"ভুল ক্রিয়ারূপ","leggete":"তোমরা পড়ো","legge":"সে পড়ে",

};

/* প্রশ্ন ও ব্যাখ্যার বাংলা অনুবাদ যোগ করা */
D.forEach((section,si)=>{
section.q.forEach((q,qi)=>{
q.bt=BNQ[si][qi]||"";
q.be=BNE[si][qi]||"";
q.bo=q.o.map(option=>OPTION_BN[option]||"");
});
});

const questionCount=D.reduce((s,a)=>s+a.q.length,0);
if(questionCount!==EXPECTED_QUESTIONS)console.error("Numero domande errato:",questionCount);

const shuffle=a=>{
a=a.slice();
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
};

const L="ABCD";
let Q=[],A=[],cur=0,fin=false;
const total=()=>Q.length;
const pages=()=>Math.ceil(total()/PAGE);
const answered=()=>A.filter(x=>x!==null).length;
const pageDone=i=>A.slice(i*PAGE,(i+1)*PAGE).every(x=>x!==null);
const gradeOf=ok=>Math.round(ok/total()*10);
const verdict=g=>g>=9?"Ottimo! 🎉":g>=PASS_GRADE?"Promosso ✓":"Da ripassare";

function escapeHTML(s){
return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function init(){
Q=[];
D.forEach(s=>s.q.forEach(q=>{
Q.push({
t:s.t,bt:topicBn[s.t]||"",
q:q.q,bq:q.bt,e:q.e,be:q.be,sw:q.sw,
o:shuffle(q.o.map((t,i)=>({t,bn:q.bo[i]||"",ok:i===q.c})))
});
}));
Q=shuffle(Q);
A=Q.map(()=>null);
cur=0;fin=false;examReportSent=false;examReportSending=false;
render();
}

function stats(){
let ok=0,topics=[];
Q.forEach((q,i)=>{
let t=topics.find(x=>x.t===q.t);
if(!t){t={t:q.t,bt:q.bt,n:0,tot:0};topics.push(t);}
t.tot++;
if(A[i]!==null&&q.o[A[i]].ok){t.n++;ok++;}
});
return {ok,topics,grade:gradeOf(ok)};
}

document.getElementById("app").innerHTML=`

</div>

function render(){
if(!started){renderStart();return;}
const app=document.getElementById("app");
if(fin){result(app);return;}

const n=answered(),pct=Math.round(n/total()*100);
let h=`
<div class="hero">
<div class="hero-top"><span class="brand">ITALIANO PRO BANGLA</span><span class="hero-badge">ESAME A0</span></div>
<h1>Esame di italiano A0</h1>
<div class="bn">ইতালীয় ভাষার A0 পরীক্ষা</div>
<div class="sub">${escapeHTML(studentNome)} ${escapeHTML(studentCognome)}</div>
</div>
<div class="bar"><i style="width:${pct}%"></i></div>
<div class="meta"><span>Risposte completate: ${n} / ${total()}</span><span>${pct}%</span></div>

<div class="tabs">${Array.from({length:pages()},(_,i)=>`<button data-tab="${i}" class="${i===cur?"on":""} ${pageDone(i)?"ok":""}">${i+1}</button>`).join("")}</div>`;

const start=cur*PAGE;

const gi=start+k;
h+=`
<div class="q">

<div class="bn">${escapeHTML(q.bq)}</div>
${q.sw?`<div class="sw" style="background:${q.sw}"></div>`:""}
${q.o.map((o,oi)=>`
<button class="o ${A[gi]===oi?"sel":""}" data-q="${gi}" data-o="${oi}">
<b>${L[oi]}</b>${escapeHTML(o.t)}

<div class="nav">
<button class="btn alt" data-go="-1" ${cur===0?"disabled":""}>← Indietro</button>
${last?`<button class="btn" data-end="1" ${n<total()?"disabled":""}>Consegna</button>`:`<button class="btn" data-go="1">Avanti →</button>`}
</div>
<div class="status-bn">${last?"সব প্রশ্নের উত্তর দিয়ে পরীক্ষা জমা দাও।":"পরবর্তী প্রশ্নে যেতে Avanti চাপো।"}</div>`;
if(last&&n<total())h+=`<div class="hint">Rispondi a tutte le domande per consegnare.<div class="status-bn">জমা দেওয়ার আগে সব প্রশ্নের উত্তর দাও।</div></div>`;
app.innerHTML=h;
}

function result(app){
const st=stats();
let rev="";
Q.forEach((q,i)=>{
const sel=A[i];
if(!q.o[sel].ok){
const correct=q.o.find(o=>o.ok);
rev+=`

}
});
const cl=x=>x>=85?"var(--ok)":x>=60?"var(--acc)":"var(--bad)";

app.innerHTML=`
<div class="hero">

<div class="lvl">${verdict(st.grade)}</div>
<div class="bn">${st.grade>=PASS_GRADE?"অভিনন্দন! তুমি পরীক্ষায় পাস করেছ।":"আরও অনুশীলন করো। তুমি আবার চেষ্টা করতে পারবে।"}</div>
</div>
<h3 style="margin:22px 0 12px">Risultati per argomento</h3>
<div class="bn">প্রতিটি বিষয়ের ফলাফল</div>
${st.topics.map(s=>{
const x=Math.round(s.n/s.tot*100);
return `<div class="row"><div><b>${escapeHTML(s.t)}</b><div class="status-bn">${escapeHTML(s.bt)}</div><div class="t"><i style="width:${x}%;background:${cl(x)}"></i></div></div><b>${s.n} / ${s.tot}</b></div>`;
}).join("")}
<div class="rev">${rev?`<h3>Rivedi gli errori</h3><div class="bn">তোমার ভুল উত্তরগুলো দেখো</div>${rev}`:`<h3>Nessun errore!</h3><div class="bn">কোনো ভুল উত্তর নেই! দারুণ!</div>`}</div>

/* PREPARA I DATI NEL FORMATO RICHIESTO DAL NUOVO APPS SCRIPT */
async function sendExamReport(){
const status=document.getElementById("send-status");
if(examReportSent||examReportSending)return;

examReportSending=true;
const st=stats();

const argomenti=st.topics.map(s=>({
t:s.t,
bn:s.bt,
n:s.n,
tot:s.tot
}));

const errori=[];
Q.forEach((q,i)=>{
const selected=q.o[A[i]];
if(!selected.ok){
const correct=q.o.find(o=>o.ok);
errori.push({
t:q.t,
bt:q.bt,
q:q.q,
bq:q.bq,
scelta:selected.t,
bscelta:selected.bn,
corretta:correct.t,
bcorretta:correct.bn,
spiegazione:q.e,
bspiegazione:q.be
});
}
});

const dati={
key:ACCESS_KEY,
nome:studentNome+" "+studentCognome,
email:studentEmail,
livello:"A0",
voto:st.grade,
totale:total(),
corrette:st.ok,
argomenti:argomenti,
errori:errori,
promosso:st.grade>=PASS_GRADE
};

try{
/*
Con mode:no-cors il browser non può leggere la risposta di Apps Script.
Quindi non dichiariamo che l'email è stata consegnata:
indichiamo che la richiesta è stata trasmessa e invitiamo a controllare la casella.
*/
await fetch(GOOGLE_SCRIPT_URL,{
method:"POST",
mode:"no-cors",
headers:{"Content-Type":"text/plain;charset=utf-8"},
body:JSON.stringify(dati)
});
examReportSent=true;
if(status){
status.innerHTML='Richiesta trasmessa. Controlla la tua email tra qualche minuto.<div class="status-bn">অনুরোধ পাঠানো হয়েছে। কয়েক মিনিট পর ইমেইল চেক করো।</div><div class="status-bn">ইমেইল না পেলে শিক্ষককে জানাও।</div>';
}
}catch(err){
console.error("Errore di invio:",err);
if(status){
status.innerHTML='Problema di connessione. Riprova a inviare il risultato.<div class="status-bn">ইন্টারনেট সংযোগে সমস্যা হয়েছে। আবার চেষ্টা করো।</div><button class="btn alt" data-resend="1">Riprova invio</button>';
}
}finally{
examReportSending=false;
}
}

/* EVENTI */
document.addEventListener("click",e=>{
const b=e.target.closest("button");
if(!b)return;

if(b.dataset.start!==undefined){
const nome=document.getElementById("student-name").value.trim();
const cognome=document.getElementById("student-surname").value.trim();
const email=document.getElementById("student-email").value.trim();
const error=document.getElementById("start-error");

if(!nome||!cognome||!email){
error.innerHTML="Inserisci nome, cognome e email.<div class='status-bn'>নাম, পদবি ও ইমেইল লিখো।</div>";
return;
}
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
error.innerHTML="Inserisci un indirizzo email valido.<div class='status-bn'>সঠিক ইমেইল ঠিকানা লিখো।</div>";
return;
}
studentNome=nome;
studentCognome=cognome;
studentEmail=email;
started=true;
init();
scrollTo(0,0);

}else if(b.dataset.o!==undefined){
A[+b.dataset.q]=+b.dataset.o;
const y=scrollY;
render();
scrollTo(0,y);

}else if(b.dataset.go){
cur+=+b.dataset.go;
render();
scrollTo(0,0);

}else if(b.dataset.tab!==undefined){
cur=+b.dataset.tab;
render();
scrollTo(0,0);

}else if(b.dataset.end!==undefined){
if(answered()===total()){
fin=true;
render();
}

}else if(b.dataset.again!==undefined){
started=false;
studentNome="";
studentCognome="";
studentEmail="";
examReportSent=false;
examReportSending=false;
renderStart();

}else if(b.dataset.resend!==undefined){
sendExamReport();
}
});

renderStart();
</script>
