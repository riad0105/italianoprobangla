
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esame A0 | Italiano Pro Bangla</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6FA;--card:#fff;--ink:#172B43;--mut:#64748B;--acc:#16A36A;--mar:#102B46;--tan:#E8EEF4;--line:#DCE5ED;--ok:#168653;--bad:#C44848;--sel:#E5F5ED}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Open Sans",Arial,sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:auto;padding:20px 16px 60px}
.hero{background:linear-gradient(135deg,#102B46,#1C4666);color:white;padding:26px 23px;border-radius:24px;margin-bottom:22px}
.hero-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:20px}
.brand{font-weight:800;font-size:.78rem;letter-spacing:.09em}
.hero-badge{background:#16A36A;padding:6px 12px;border-radius:30px;font-size:.72rem;font-weight:800}
h1{font-size:1.8rem;line-height:1.2;margin-bottom:8px}
.sub{color:var(--mut);font-size:.92rem}
.hero .sub{color:#D8E6F0}
.start-card,.q,.score,.wq{background:white;border:1px solid var(--line);border-radius:20px;padding:19px;margin-bottom:14px}
.start-card h2{color:var(--mar)}
label{display:block;font-weight:700;margin:16px 0 7px;font-size:.9rem}
input{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;background:#F7F9FC;font:inherit;font-size:1rem}
input:focus{outline:none;border-color:var(--acc)}
.btn{font:700 .95rem "Open Sans",sans-serif;border:0;border-radius:13px;padding:13px 22px;cursor:pointer;background:var(--acc);color:white}
.btn.alt{background:#E8EEF4;color:var(--mar)}
.btn:disabled{opacity:.4;cursor:default}
.start-card .btn{width:100%;margin-top:22px}
.start-note,.hint{font-size:.83rem;color:var(--mut);text-align:center;margin-top:12px}
.error-message{color:var(--bad);font-size:.88rem;margin-top:10px}
.bar{height:9px;background:var(--tan);border-radius:99px;overflow:hidden;margin:18px 0 8px}
.bar i{display:block;height:100%;background:var(--acc)}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mut)}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}
.tabs button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:8px 13px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--mar);color:white}
.tabs button.ok:after{content:" ✓"}
.topic{font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.q h3{font-size:1rem;margin-bottom:10px}
.q h3 span{color:var(--acc);margin-right:7px}
.o{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:#F7F9FC;border:2px solid var(--line);border-radius:13px;padding:12px 14px;margin-top:9px;cursor:pointer}
.o.sel{background:var(--sel);border-color:var(--acc)}
.o b{color:var(--acc);margin-right:9px}
.sw{width:96px;height:96px;border-radius:50%;margin:12px auto;border:3px solid var(--line)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.score{text-align:center;padding:28px 18px}
.big{font-size:4rem;font-weight:800;color:var(--mar);line-height:1.1}
.big small{font-size:1.5rem;color:var(--mut)}
.lvl{font-weight:800;font-size:1.1rem;margin-top:7px;color:var(--acc)}
.row{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center;margin:13px 0;font-size:.9rem}
.row .t{height:10px;background:var(--tan);border-radius:99px;overflow:hidden;margin-top:6px}
.row .t i{display:block;height:100%;border-radius:99px}
.row>b{text-align:right}
.rev h3{margin:24px 0 12px;color:var(--mar)}
.wq{font-size:.92rem;padding:15px}
.wq .a{margin-top:6px}
.x{color:var(--bad)}.v{color:var(--ok)}
.ex{margin-top:9px;font-size:.85rem;color:var(--mut);border-left:4px solid var(--acc);padding-left:10px}
@media(max-width:480px){.wrap{padding:14px 12px 45px}.hero{padding:22px 18px}.q{padding:15px}.nav .btn{padding:12px 15px;font-size:.86rem}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const GOOGLE_SCRIPT_URL='https://script.google.com/macros/s/AKfycbx8-6u6cf0jluhgf5ETS3K0l9MgLsN_izO_8EQhD_8DRcUgd3gh27Psbr15N4bPSe19/exec';
const ACCESS_KEY='IPB-A0-2026-R7mQ9xK4pL2vN8cT';
const PAGE=7, PASS_GRADE=6, EXPECTED_QUESTIONS=67;
let studentNome='',studentCognome='',studentEmail='',started=false,examReportSent=false,examReportSending=false;
const m=(q,o,c,e,sw)=>({q,o,c,e,sw});
const colore=(n,o,hex)=>m("Che colore è?",o,o.indexOf(n),"Il colore è "+n+".",hex);

const D=[
{t:"Suoni dolci e duri (C, G, SC)",q:[
m("Quale di queste parole ha il suono dolce della C?",["cane","cena","chiave","come"],1,"CE ha il suono dolce."),
m("Quale di queste parole ha il suono duro della G?",["gelato","giorno","gatto","gita"],2,"GA, GO, GU hanno il suono duro."),
m("In “giorno” la lettera I…",["si pronuncia chiaramente","non si pronuncia","si legge come E","si legge come U"],1,"In GIA, GIO, GIU la I serve a indicare il suono dolce della G."),
m("Quale gruppo di lettere ha il suono dolce?",["SCA","SCO","SCE","SCHI"],2,"SCE e SCI hanno il suono dolce."),
m("Per avere il suono duro della C davanti a E e I si scrive…",["la H","la S","la I","la A"],0,"CHE e CHI: la H mantiene il suono duro della C.")
]},
{t:"Giorni della settimana e mesi dell’anno",q:[
m("Quale giorno viene dopo martedì?",["lunedì","mercoledì","giovedì","venerdì"],1,"Dopo martedì c’è mercoledì."),
m("Quale giorno viene prima di domenica?",["sabato","venerdì","lunedì","giovedì"],0,"Prima di domenica c’è sabato."),
m("Quale mese viene dopo agosto?",["luglio","settembre","ottobre","giugno"],1,"Agosto, settembre, ottobre."),
m("Il primo mese dell’anno è…",["gennaio","febbraio","dicembre","marzo"],0,"Gennaio è il primo mese dell’anno."),
m("Oggi è giovedì. Dopodomani è…",["venerdì","sabato","domenica","mercoledì"],1,"Domani è venerdì, dopodomani è sabato."),
m("Quale mese viene prima di maggio?",["marzo","aprile","giugno","luglio"],1,"Aprile viene prima di maggio.")
]},
{t:"I numeri da 1 a 100.000",q:[
m("Come si scrive 17?",["diciassette","dicesette","diciasette","diecisette"],0,"17 = diciassette."),
m("Come si scrive 48?",["quarantotto","quaranta otto","quarantaotto","quattrovanta"],0,"48 si scrive quarantotto, tutto attaccato."),
m("Quanto fa 15 + 25?",["trenta","quaranta","cinquanta","trentacinque"],1,"15 + 25 = 40 = quaranta."),
m("Come si scrive 1.000?",["cento","mille","mila","diecimila"],1,"1.000 = mille."),
m("Come si scrive 20.000?",["ventimila","venti mila","ventemila","duemila"],0,"20.000 = ventimila, tutto attaccato."),
m("Come si scrive 100.000?",["centomila","cento mille","millecento","diecimila"],0,"100.000 = centomila."),
m("Come si scrive 36?",["trentasei","trenta sei","trentasette","trentaseiotto"],0,"36 = trentasei, tutto attaccato.")
]},
{t:"Come si forma il NON",q:[
m("Dove si mette “non” in una frase?",["prima del verbo","dopo il verbo","alla fine della frase","prima del soggetto"],0,"NON si mette prima del verbo."),
m("Quale frase è corretta?",["Marco non parla italiano","Marco parla non italiano","Non Marco parla italiano","Marco parla italiano non"],0,"La forma comune è: soggetto + non + verbo."),
m("Completa: Io ____ sono stanco.",["non","no","mai","nessuno"],0,"Io non sono stanco."),
m("“Sei italiano?” Quale risposta negativa è corretta?",["No, sono non italiano","No, non sono italiano","Non, sono italiano","Sì, non sono italiano"],1,"No, non sono italiano."),
m("Quale frase è la negativa di “Noi mangiamo la pizza”?",["Noi non mangiamo la pizza","Noi mangiamo non la pizza","Non noi mangiamo la pizza","Noi mangiamo la pizza non"],0,"Noi non mangiamo la pizza."),
m("Completa: Loro ____ abitano a Roma.",["non","no","nessuno","mai"],0,"Loro non abitano a Roma.")
]},
{t:"Le nazionalità",q:[
m("Lui è italiano. Lei è…",["italiano","italiana","italiani","italiane"],1,"Femminile singolare: italiana."),
m("Quale frase è corretta?",["Marie è francese","Marie è francesa","Marie è francesi","Marie è franceso"],0,"Le nazionalità in -E non cambiano al femminile."),
m("Marco e Luca sono italiani. Anna e Sara sono…",["italiano","italiana","italiani","italiane"],3,"Femminile plurale: italiane."),
m("Carlos è spagnolo. Maria è…",["spagnolo","spagnola","spagnoli","spagnole"],1,"Femminile singolare: spagnola."),
m("Quale nazionalità ha la stessa forma al maschile e al femminile?",["italiano","spagnolo","inglese","tedesco"],2,"Inglese: lui è inglese, lei è inglese.")
]},
{t:"I colori",q:[
colore("rosso",["rosso","rosa","arancione","marrone"],"#C0392B"),
colore("giallo",["giallo","arancione","verde","bianco"],"#F2C94C"),
colore("verde",["blu","verde","viola","grigio"],"#4F9A55"),
colore("blu",["azzurro","blu","nero","viola"],"#1F3B6B"),
colore("bianco",["grigio","bianco","giallo","rosa"],"#FFFFFF"),
colore("nero",["nero","marrone","blu","grigio"],"#222222")
]},
{t:"Il verbo ESSERE: a che cosa serve",q:[
m("Io ____ Hassan.",["sei","sono","è","siamo"],1,"Con IO si usa SONO."),
m("Tu ____ stanco.",["sei","sono","è","siete"],0,"Con TU si usa SEI."),
m("“Il libro è sul tavolo.” Qui il verbo ESSERE indica…",["identità","posizione","età","professione"],1,"Indica dove si trova il libro: la posizione."),
m("“Marco è alto.” Qui il verbo ESSERE indica…",["descrizione","posizione","origine","tempo"],0,"Indica una caratteristica di Marco."),
m("“Sono insegnante.” Qui il verbo ESSERE indica…",["posizione","professione","tempo","età"],1,"Indica la professione."),
m("Completa: Noi ____ a casa.",["sono","siamo","siete","è"],1,"Con NOI si usa SIAMO.")
]},
{t:"Il verbo AVERE: età, possesso, sensazioni fisiche",q:[
m("Io ____ 25 anni.",["sono","ho","ha","hai"],1,"Per esprimere l’età si usa AVERE: ho 25 anni."),
m("Marco ____ una macchina nuova.",["ha","è","hai","ho"],0,"Per esprimere il possesso si usa AVERE."),
m("Per dire che hai sete, sonno o freddo si usa il verbo…",["avere","essere","stare","fare"],0,"Fame, sete, sonno, caldo e freddo si esprimono con AVERE."),
m("Noi ____ sete.",["abbiamo","avete","hanno","siamo"],0,"Con NOI si usa ABBIAMO."),
m("Quale frase è corretta?",["Ho venti anni","Sono venti anni","Ho venti anno","Sono venti"],0,"Per esprimere l’età si dice: ho venti anni."),
m("Loro ____ fame.",["ha","hanno","abbiamo","avete"],1,"Con LORO si usa HANNO.")
]},
{t:"Maschile, femminile, singolare e plurale",q:[
m("Qual è il plurale di “libro”?",["libri","libre","libra","libro"],0,"-O diventa -I: libri."),
m("Qual è il plurale di “casa”?",["casi","case","casa","cose"],1,"-A diventa -E: case."),
m("Qual è il plurale di “padre”?",["padri","padre","padra","padres"],0,"-E diventa -I: padri."),
m("Quale parola è femminile singolare?",["gatti","penna","libri","ragazzi"],1,"Penna è femminile singolare."),
m("“Le ragazze” è…",["maschile plurale","femminile plurale","femminile singolare","maschile singolare"],1,"Le ragazze = femminile plurale.")
]},
{t:"Nomi comuni e nomi propri",q:[
m("Quale parola è un nome proprio?",["gatto","Marco","libro","ragazzo"],1,"Marco è il nome proprio di una persona."),
m("Quale parola è un nome comune?",["Anna","Hassan","ragazzo","Marco"],2,"Ragazzo è un nome comune."),
m("I nomi propri si scrivono con…",["la lettera maiuscola","la lettera minuscola","il corsivo","due maiuscole"],0,"I nomi propri iniziano con la lettera maiuscola."),
m("Quale frase è scritta correttamente?",["io sono hassan","Io sono Hassan","io sono Hassan","Io sono hassan"],1,"La frase inizia con la maiuscola e Hassan è un nome proprio."),
m("“Anna” è un nome…",["comune","proprio","plurale","maschile"],1,"Anna è un nome proprio.")
]},
{t:"Gli aggettivi",q:[
m("La casa è ____ (nuovo).",["nuovo","nuova","nuovi","nuove"],1,"Casa è femminile singolare: nuova."),
m("I libri sono ____ (grande).",["grande","grandi","grando","grandà"],1,"Gli aggettivi in -E hanno il plurale in -I."),
m("Le ragazze sono ____ (alto).",["alto","alta","alti","alte"],3,"Femminile plurale: alte."),
m("Che cos’è un aggettivo?",["Una parola che descrive una persona, un animale o una cosa","Una parola che indica un’azione","Una parola che indica un nome proprio","Una parola che collega due frasi"],0,"L’aggettivo descrive una persona, un animale o una cosa."),
m("A che cosa serve un aggettivo?",["A descrivere una qualità o una caratteristica","A indicare un’azione","A dire quando succede qualcosa","A fare una domanda"],0,"L’aggettivo serve a dire com’è una persona, un animale o una cosa.")
]},
{t:"Verbi in -ARE, -ERE, -IRE al presente",q:[
m("Io ____ (parlare) italiano.",["parli","parlo","parla","parlano"],1,"Con IO: parl-o."),
m("Tu ____ (prendere) il caffè.",["prendi","prende","prendo","prendono"],0,"Con TU: prend-i."),
m("Noi ____ (dormire) molto.",["dormiamo","dormite","dormono","dormo"],0,"Con NOI: dorm-iamo."),
m("Loro ____ (leggere) un libro.",["leggono","leggano","leggete","legge"],0,"Con LORO: leggono."),
m("Voi ____ (lavorare) in banca.",["lavorate","lavorano","lavorete","lavoro"],0,"Con VOI: lavor-ate.")
]}
];

const questionCount=D.reduce((s,a)=>s+a.q.length,0);
if(questionCount!==EXPECTED_QUESTIONS)console.error("Numero domande errato:",questionCount);

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const L="ABCD";
let Q=[],A=[],cur=0,fin=false;
const total=()=>Q.length;
const pages=()=>Math.ceil(total()/PAGE);
const answered=()=>A.filter(x=>x!==null).length;
const pageDone=i=>A.slice(i*PAGE,(i+1)*PAGE).every(x=>x!==null);
const gradeOf=ok=>Math.round(ok/total()*10);
const verdict=g=>g>=9?"Ottimo! 🎉":g>=PASS_GRADE?"Promosso ✓":"Da ripassare";

function escapeHTML(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}

function init(){
Q=[];
D.forEach(s=>s.q.forEach(q=>Q.push({t:s.t,q:q.q,e:q.e,sw:q.sw,o:shuffle(q.o.map((t,i)=>({t,ok:i===q.c})))})));
Q=shuffle(Q);A=Q.map(()=>null);cur=0;fin=false;examReportSent=false;examReportSending=false;render();
}

function stats(){
let ok=0,topics=[];
Q.forEach((q,i)=>{
let t=topics.find(x=>x.t===q.t);
if(!t){t={t:q.t,n:0,tot:0};topics.push(t);}
t.tot++;
if(A[i]!==null&&q.o[A[i]].ok){t.n++;ok++;}
});
return {ok,topics,grade:gradeOf(ok)};
}

function renderStart(){
document.getElementById("app").innerHTML=`
<div class="hero"><div class="hero-top"><span class="brand">ITALIANO PRO BANGLA</span><span class="hero-badge">ESAME A0</span></div><h1>Metti alla prova il tuo italiano!</h1><div class="sub">Preparati, concentrati e dimostra quello che sai.</div></div>
<div class="start-card"><h2>Benvenuto!</h2><p class="sub">Inserisci i tuoi dati prima di iniziare.</p>
<label for="student-name">Nome *</label><input id="student-name" autocomplete="given-name" maxlength="60" placeholder="Il tuo nome">
<label for="student-surname">Cognome *</label><input id="student-surname" autocomplete="family-name" maxlength="60" placeholder="Il tuo cognome">
<label for="student-email">Indirizzo email *</label><input id="student-email" type="email" autocomplete="email" maxlength="120" placeholder="La tua email">
<div id="start-error" class="error-message"></div>
<button class="btn" data-start="1">INIZIA L'ESAME →</button>
<div class="start-note">Il risultato dell'esame sarà inviato via email a te e all'insegnante.</div></div>`;
scrollTo(0,0);
}

function render(){
if(!started){renderStart();return;}
const app=document.getElementById("app");
if(fin){result(app);return;}
const n=answered(),pct=Math.round(n/total()*100);
let h=`<div class="hero"><div class="hero-top"><span class="brand">ITALIANO PRO BANGLA</span><span class="hero-badge">ESAME A0</span></div><h1>Esame di italiano A0</h1><div class="sub">${escapeHTML(studentNome)} ${escapeHTML(studentCognome)}</div></div>
<div class="bar"><i style="width:${pct}%"></i></div><div class="meta"><span>Risposte completate: ${n} / ${total()}</span><span>${pct}%</span></div>
<div class="tabs">${Array.from({length:pages()},(_,i)=>`<button data-tab="${i}" class="${i===cur?"on":""} ${pageDone(i)?"ok":""}">${i+1}</button>`).join("")}</div>`;
const start=cur*PAGE;
Q.slice(start,start+PAGE).forEach((q,k)=>{
const gi=start+k;
h+=`<div class="q"><div class="topic">${escapeHTML(q.t)}</div><h3><span>${gi+1}.</span>${escapeHTML(q.q)}</h3>${q.sw?`<div class="sw" style="background:${q.sw}"></div>`:""}${q.o.map((o,oi)=>`<button class="o ${A[gi]===oi?"sel":""}" data-q="${gi}" data-o="${oi}"><b>${L[oi]}</b>${escapeHTML(o.t)}</button>`).join("")}</div>`;
});
const last=cur===pages()-1;
h+=`<div class="nav"><button class="btn alt" data-go="-1" ${cur===0?"disabled":""}>← Indietro</button>${last?`<button class="btn" data-end="1" ${n<total()?"disabled":""}>Consegna</button>`:`<button class="btn" data-go="1">Avanti →</button>`}</div>`;
if(last&&n<total())h+=`<div class="hint">Rispondi a tutte le domande per consegnare.</div>`;
app.innerHTML=h;
}

function result(app){
const st=stats();let rev="";
Q.forEach((q,i)=>{
const sel=A[i];
if(!q.o[sel].ok)rev+=`<div class="wq"><b>${escapeHTML(q.q)}</b><div class="a x">✗ ${escapeHTML(q.o[sel].t)}</div><div class="a v">✓ ${escapeHTML(q.o.find(o=>o.ok).t)}</div><div class="ex">${escapeHTML(q.e)}</div></div>`;
});
const cl=x=>x>=85?"var(--ok)":x>=60?"var(--acc)":"var(--bad)";
app.innerHTML=`<div class="hero"><div class="hero-top"><span class="brand">ITALIANO PRO BANGLA</span><span class="hero-badge">ESAME A0</span></div><h1>Il tuo risultato</h1><div class="sub">Ecco come è andato il tuo esame.</div></div>
<div class="sub" style="text-align:center">Studente: <strong>${escapeHTML(studentNome)} ${escapeHTML(studentCognome)}</strong><br>Email: ${escapeHTML(studentEmail)}</div>
<div class="score"><div class="big">${st.grade}<small> / 10</small></div><div class="sub">${st.ok} risposte giuste su ${total()}</div><div class="lvl">${verdict(st.grade)}</div></div>
${st.topics.map(s=>{const x=Math.round(s.n/s.tot*100);return `<div class="row"><div><b>${escapeHTML(s.t)}</b><div class="t"><i style="width:${x}%;background:${cl(x)}"></i></div></div><b>${s.n} / ${s.tot}</b></div>`;}).join("")}
<div class="rev">${rev?`<h3>Rivedi gli errori</h3>${rev}`:`<h3>Nessun errore!</h3>`}</div>
<div id="send-status" class="hint">Invio del risultato in corso…</div>
<div class="nav"><button class="btn" data-again="1">Ricomincia con nuove domande</button></div>`;
sendExamReport();scrollTo(0,0);
}

async function sendExamReport(){
const status=document.getElementById("send-status");
if(examReportSent||examReportSending)return;
examReportSending=true;
const st=stats();
const lines=[
"ESAME DI ITALIANO A0","NOME: "+studentNome,"COGNOME: "+studentCognome,
"EMAIL: "+studentEmail,"VOTO: "+st.grade+"/10",
"RISPOSTE GIUSTE: "+st.ok+" su "+total(),
"ESITO: "+(st.grade>=PASS_GRADE?"PROMOSSO":"NON ANCORA PROMOSSO"),
"","RISULTATI PER ARGOMENTO:",
...st.topics.map(s=>s.t+": "+s.n+"/"+s.tot),"","RISPOSTE SBAGLIATE:"
];
let wrong=0;
Q.forEach((q,i)=>{
const selected=q.o[A[i]];
if(!selected.ok){wrong++;lines.push(q.t+" — "+q.q);lines.push("Risposta data: "+selected.t);lines.push("Risposta corretta: "+q.o.find(o=>o.ok).t);if(q.e)lines.push("Spiegazione: "+q.e);}
});
if(!wrong)lines.push("Nessuna risposta sbagliata.");
const dati={key:ACCESS_KEY,nome:studentNome+" "+studentCognome,email:studentEmail,livello:"A0",voto:st.grade,messaggio:lines.join("\n")};
try{
await fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(dati)});
examReportSent=true;
if(status)status.textContent="✓ Richiesta inviata. Il PDF sarà elaborato e inviato via email.";
}catch(err){
console.error(err);
if(status)status.innerHTML='Invio non riuscito. Controlla la connessione e <button class="btn alt" data-resend="1">Riprova invio</button>.';
}finally{examReportSending=false;}
}

document.addEventListener("click",e=>{
const b=e.target.closest("button");if(!b)return;
if(b.dataset.start!==undefined){
const nome=document.getElementById("student-name").value.trim();
const cognome=document.getElementById("student-surname").value.trim();
const email=document.getElementById("student-email").value.trim();
const error=document.getElementById("start-error");
if(!nome||!cognome||!email){error.textContent="Inserisci nome, cognome e email.";return;}
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){error.textContent="Inserisci un indirizzo email valido.";return;}
studentNome=nome;studentCognome=cognome;studentEmail=email;started=true;init();scrollTo(0,0);
}else if(b.dataset.o!==undefined){A[+b.dataset.q]=+b.dataset.o;const y=scrollY;render();scrollTo(0,y);}
else if(b.dataset.go){cur+=+b.dataset.go;render();scrollTo(0,0);}
else if(b.dataset.tab!==undefined){cur=+b.dataset.tab;render();scrollTo(0,0);}
else if(b.dataset.end!==undefined){if(answered()===total()){fin=true;render();}}
else if(b.dataset.again!==undefined){started=false;studentNome="";studentCognome="";studentEmail="";examReportSent=false;examReportSending=false;renderStart();}
else if(b.dataset.resend!==undefined){sendExamReport();}
});

renderStart();
</script>
</body>
</html>
